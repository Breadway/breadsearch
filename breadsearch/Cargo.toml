[package]
name = "breadsearch"
version = "0.3.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "breadsearch"
path = "src/main.rs"

[dependencies]
breadsearch-shared = { path = "../breadsearch-shared" }
bread-theme = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", tag = "v0.7.1", features = ["gtk"] }
# Capture primitives for `--screenshot` mode — see src/screenshot.rs.
# Not on tag v0.7.1 (crate landed after that tag). Rev, not branch=main.
# v0.7.1 predates this crate; same rev siblings use.
bread-screenshots = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", rev = "69ce2d67a8de8a09c064aa9d7ff99b46656f0b1d" }
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
